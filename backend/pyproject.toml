[project]
name = "options-api"
version = "0.1.0"
description = "Local Nasdaq covered-call and cash-secured-put options workstation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.2",
    "exchange-calendars>=4.11,<5",
    "fastapi>=0.115",
    "httpx[http2]>=0.28",
    "numpy>=2",
    "pandas>=2.2",
    "polars>=1.30",
    "pyarrow>=18",
    "pydantic>=2.13",
    "regimelib==0.1.0",
    "uvicorn[standard]>=0.32",
    "yfinance>=1.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    # starlette.testclient imports httpx2 dynamically; filterwarnings turns its absence into collection errors.
    "httpx2>=2.9",
    "ruff>=0.15",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["−"]

[tool.ruff.lint.per-file-ignores]
"src/stocksweeper/**/*.py" = ["SIM", "RUF"]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["options_api", "stocksweeper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "error::starlette.exceptions.StarletteDeprecationWarning",
]
