[project]
name = "options-api"
version = "0.1.0"
description = "Local Nasdaq covered-call and cash-secured-put options workstation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx[http2]>=0.28",
    "pydantic>=2.10",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "error::starlette.exceptions.StarletteDeprecationWarning",
]
